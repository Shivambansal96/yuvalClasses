<p>I love Pijja</p>
<!-- bold -->
<p>I love <b>Pijja</b></p>
<!-- bold / Strong -->
<p>I love <strong>Pijja</strong></p>
<!-- italics -->
<p>I love <i>Pijja</i></p>
<!-- Italics / Emphasis -->
<p>I love <em>Pijja</em></p>
<!-- Strike -->
<p>I love <strike>Pijja</strike></p>
<!-- Delete -->
<p>I love <del>Pijja</del></p>
<!-- big -->
<p>I love <big>Pijja</big></p>
<!-- small -->
<p>I love <small>Pijja</small></p>
<!-- Highlight -->
<p>I love <mark>Pijja</mark></p>
<!-- put it in middle -->
<p>I love <center>Pijja</center>
</p>
<!-- SubScript Subway goes underground -->
<p>I love <sub>Pijja</sub></p>
<!-- SubScript Subway goes underground-->
<p>H<sub>2</sub>O</p>
<!-- SuperScript Superman goes up -->
<p>2<sup>5</sup></p>
