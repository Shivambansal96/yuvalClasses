<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/c2247944bd.js" crossorigin="anonymous"></script>
    <title>FlipKart NavBar</title>
</head>

<body>

    <div id="mainContainer">

        <div id="navbar">
            <div id="logo" style="width: 100px;">
                <img src="./assets/flipkart_logo.png" alt="flipkart_logo" height="30px" width="80px">
            </div>
            <div id="searchBar" style="width: 225px;">
                <input type="text" id="inputTag" placeholder="Search for products, brands and more">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div id="button" style="width: 70px;">
                <button>Login</button>
            </div>
            <div id="BecomeASeller"><span class="text">Become a Seller</span></div>
            <div id="more">
                <span class="text">More</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div id="cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="text">Cart</span>
            </div>
        </div>

        <div id="dropdowns">
            <div id="offer1" class="offer">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/1)%20Top%20Offers.png"
                    alt="">
                <span class="text">Top Offers</span>
            </div>

            <div id="offer2" class="offer">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/2)%20Grocery.png" alt="">
                <span class="text">Groceries</span>
            </div>

            <div id="offer3" class="offer">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/3)%20Mobiles.png" alt="">
                <span class="text">Mobiles</span>
            </div>

            <div id="offer4" class="offerDD">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/4)%20Fashion.png" alt="">
                <div class="dd">
                    <span class="text">Fashion</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>

            <div id="offer5" class="offerDD">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/5)%20Electronics.png"
                    alt="">
                <div class="dd">
                    <span class="text">Electronics</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>

            <div id="offer6" class="offerDD">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/6)%20Home.jpg" alt="">
                <div class="dd">
                    <span class="text">Home</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>

            <div id="offer7" class="offer">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/7)%20Appliances.png"
                    alt="">
                <span class="text">Appliances</span>
            </div>

            <div id="offer8" class="offer">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/8)%20Travel.png" alt="">
                <span class="text">Travel</span>
            </div>

            <div id="offer9" class="offerDD">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/9)%20Beauty,%20Toys%20&%20More.png"
                    alt="">
                <div class="dd">
                    <span class="text">Beauty, Toys & More</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>

            <div id="offer10" class="offer">
                <img src="https://shivambansal96.github.io/Flipkart-navBar-HTML-CSS-7/images/10)%202-Wheelers.png"
                    alt="">
                <span class="text">2-Wheelers</span>
            </div>
        </div>

    </div>

</body>

</html>
